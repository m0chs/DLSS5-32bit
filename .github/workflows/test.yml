name: Toolkit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test reversible file operations and diagnostics
        shell: ${{ matrix.shell }}
        run: .\tests\Test-Toolkit.ps1
      - name: Build source-only archive
        shell: ${{ matrix.shell }}
        run: .\tools\New-SourceRelease.ps1
