name: Toolkit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Toolkit.ps1
      - name: Test with PowerShell 7
        shell: pwsh
        run: .\tests\Test-Toolkit.ps1
      - name: Build source-only archive
        shell: powershell
        run: .\tools\New-SourceRelease.ps1
